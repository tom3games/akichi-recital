<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#231f2b;--paper:#f2ecdf;--paper2:#e4dccb;--red:#c4302b;--gold:#e7b43b;--night:#2b2f55;--sub:#5a5550;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;--hand:"Yusei Magic","Zen Kaku Gothic New",sans-serif;--min:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
}
html{background:#2b2f55;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--ui);color:var(--ink);background:#2b2f55;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;height:100svh}
button,canvas,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
.view{position:fixed;inset:0;height:100svh;overflow:hidden}
#stage{position:fixed;inset:0;width:100vw;height:100svh;display:block}
#boot-err{position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px}

/* ---------- ロード: アンプのメーターが振れる ---------- */
#vLoad{background:#2b2f55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;color:#f2ecdf}
#vLoad svg{width:120px;height:96px}
#ldNeedle{transform-origin:60px 70px;animation:needle 1.1s ease-in-out infinite alternate}
@keyframes needle{0%{transform:rotate(-38deg)}60%{transform:rotate(22deg)}100%{transform:rotate(41deg)}}
#loadTxt{font-size:15px;letter-spacing:.08em;opacity:.85}
#loadBar{width:160px;height:3px;background:rgba(242,236,223,.2);overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}

/* ---------- タイトル: フェンスに結んだ段ボールの看板 ---------- */
#vTitle{display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));pointer-events:none}
#vTitle>*{pointer-events:auto}
.sign{position:relative;margin-top:2.5svh;width:min(88vw,360px);padding:14px 14px 12px;background:#c99c62;background-image:repeating-linear-gradient(90deg,rgba(80,50,20,.07) 0 2px,transparent 2px 9px);border-radius:3px;transform:rotate(-2.5deg);box-shadow:0 10px 18px -10px rgba(0,0,0,.6);text-align:center}
.sign::before,.sign::after{content:"";position:absolute;top:-14px;width:2px;height:22px;background:#3b3530}
.sign::before{left:16px;transform:rotate(-14deg)}.sign::after{right:16px;transform:rotate(14deg)}
.sign h1{font-family:var(--hand);font-weight:400;color:#1d1a24;font-size:clamp(28px,9.2vw,42px);line-height:1.05;letter-spacing:.01em;white-space:nowrap}
.sign h1 small{white-space:normal}
.sign h1 small{display:block;font-size:.5em;color:var(--red);margin-top:4px;letter-spacing:.04em;transform:rotate(1.5deg)}
.lead{margin-top:1.4svh;font-weight:700;font-size:14px;line-height:1.5;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);text-align:center;max-width:330px;text-wrap:balance}
.tbottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,360px)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border-radius:40px;background:var(--red);color:#fff;font-weight:900;font-size:22px;letter-spacing:.06em;box-shadow:0 5px 0 #7d1c19,0 10px 18px -6px rgba(0,0,0,.55);border:2px solid #23121a}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #7d1c19}
.big svg{width:30px;height:30px;flex:none}
.priv{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);text-align:center}
.sub{min-height:44px;padding:0 16px;border-radius:24px;background:rgba(242,236,223,.92);font-weight:700;font-size:15px;color:var(--ink);border:1.5px solid #23121a}
.mini{display:flex;gap:8px;justify-content:center}
.mini button,.mini a{min-height:36px;min-width:44px;padding:0 12px;border-radius:6px;background:rgba(30,26,40,.62);color:#f2ecdf;font-size:13px;font-weight:700;display:inline-flex;align-items:center;text-decoration:none}
#bMute{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:40;width:44px;height:44px;border-radius:50%;background:rgba(30,26,40,.55);display:grid;place-items:center}
#bMute svg{width:22px;height:22px}

/* ---------- 歌う ---------- */
#vSing{pointer-events:none}
#recBar{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:6px;background:rgba(20,18,28,.7);color:#fff;font-weight:900;font-size:14px;letter-spacing:.08em;white-space:nowrap}
#recBar .dot{width:11px;height:11px;border-radius:50%;background:#e33}
#recBar.on .dot{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#recBar .pips{display:flex;gap:4px;margin-left:4px}
#recBar .pips i{width:14px;height:6px;border-radius:2px;background:#f2ecdf}
#recBar .pips i.off{background:rgba(242,236,223,.2)}
#reqPaper{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 46px);background:#fbf8f0;padding:7px 10px 8px;transform:rotate(-4deg);box-shadow:0 6px 10px -6px rgba(0,0,0,.6);max-width:46vw}
#reqPaper b{display:block;font-size:11px;color:var(--sub);font-weight:700}
#reqPaper span{font-family:var(--hand);font-size:22px;line-height:1.1;color:var(--red)}
#liveBox{position:absolute;left:12px;right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 124px);height:78px;display:flex;gap:8px;align-items:center;transform:rotate(-1deg)}
#liveBox[hidden]{display:none}
#liveWave{flex:1;height:64px;background-color:#fbf8f0;background-image:repeating-linear-gradient(90deg,transparent 0 19px,rgba(196,48,43,.13) 19px 20px),repeating-linear-gradient(0deg,transparent 0 15px,rgba(196,48,43,.10) 15px 16px);box-shadow:0 6px 10px -6px rgba(0,0,0,.6);border-top:3px solid #e9dfc8;border-bottom:3px solid #e9dfc8;min-width:0}
#liveScope{width:78px;height:78px;flex:none;border-radius:50%;background:#fbf8f0;border:5px solid #23121a;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#count{position:absolute;left:0;right:0;top:24svh;text-align:center;font-family:var(--hand);font-size:120px;line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
#singCue{position:absolute;left:0;right:0;top:20svh;text-align:center;font-family:var(--hand);font-size:52px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#fingerTip{position:absolute;left:0;right:0;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 186px);text-align:center;color:#fff;font-weight:900;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#bHeart{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:170px;height:170px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 40% 35%,#ff8a7a,#c4302b 60%,#7d1c19);border:3px solid #23121a;color:#fff;font-weight:900;font-size:18px;box-shadow:0 6px 0 #5d1512;touch-action:none}
#bHeart.down{transform:translateX(-50%) translateY(4px) scale(.97);box-shadow:0 2px 0 #5d1512}

/* ---------- 判定の間: 段ボールの「判定中…」が揺れる ---------- */
#vSus{pointer-events:auto}
#susSign{position:absolute;left:50%;top:calc(max(14px,env(safe-area-inset-top)) + 40px);transform:translateX(-50%);transform-origin:50% -18px;padding:8px 18px 9px;background:#c99c62;background-image:repeating-linear-gradient(90deg,rgba(80,50,20,.07) 0 2px,transparent 2px 9px);border-radius:3px;box-shadow:0 8px 14px -8px rgba(0,0,0,.6);animation:susSwing 1.3s ease-in-out infinite alternate;white-space:nowrap}
#susSign::before,#susSign::after{content:"";position:absolute;top:-30px;width:2px;height:32px;background:#3b3530}
#susSign::before{left:14px}#susSign::after{right:14px}
#susTxt{font-family:var(--hand);font-size:30px;line-height:1.1;color:#1d1a24}
@keyframes susSwing{0%{transform:translateX(-50%) rotate(-4deg)}100%{transform:translateX(-50%) rotate(4deg)}}
#susSign.droop{animation:none;transform:translateX(-50%) translateY(10px) rotate(16deg);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
#susSign.pop{animation:none;transform:translateX(-50%) scale(1.25) rotate(-3deg);opacity:0;transition:transform .2s,opacity .25s .05s}
#susSkip{position:absolute;right:12px;bottom:max(10px,env(safe-area-inset-bottom));color:rgba(255,255,255,.7);font-size:12px;font-weight:700}

/* ---------- 破壊の場面: 速報の帯 ---------- */
#vShow{pointer-events:auto}
#telop{position:absolute;left:0;right:0;top:15svh;display:flex;align-items:stretch;transform:translateX(-110%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#telop.in{transform:none}
#telop b{flex:none;background:var(--red);color:#fff;font-weight:900;font-size:15px;padding:10px 10px;display:flex;align-items:center;letter-spacing:.1em}
#telop span{flex:1;background:rgba(250,248,242,.96);color:#111;font-weight:900;font-size:clamp(22px,6.6vw,30px);padding:8px 12px;line-height:1.2}
#skipHint{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));color:rgba(255,255,255,.7);font-size:12px;font-weight:700}

/* ---------- 結果: 号外 ---------- */
#vResult{display:flex;flex-direction:column;align-items:center;padding:calc(max(8px,env(safe-area-inset-top)) + 46px) 12px max(10px,env(safe-area-inset-bottom));background:rgba(20,18,30,.55)}
.paper{position:relative;width:min(100%,400px);background:var(--paper);background-image:repeating-linear-gradient(0deg,rgba(60,40,10,.03) 0 1px,transparent 1px 3px);padding:10px 12px 10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.7);transform:rotate(-1deg);flex:none}
.mast{display:flex;align-items:center;gap:8px;border-bottom:3px double var(--ink);padding-bottom:5px;padding-right:40px}
.mast .name{font-family:var(--min);font-weight:800;font-size:20px;letter-spacing:.08em}
.mast .ex{background:var(--red);color:#fff;font-family:var(--min);font-weight:800;font-size:15px;padding:2px 7px}
.mast .date{margin-left:auto;font-size:10px;color:var(--sub);text-align:right;line-height:1.3}
#rHead{font-family:var(--min);font-weight:800;font-size:clamp(28px,8.6vw,38px);line-height:1.14;margin:7px 0 4px;letter-spacing:-.01em;text-wrap:balance}
#rSub{font-size:13px;font-weight:700;color:#3b3640;line-height:1.4}
.photo{position:relative;margin-top:7px;border:1.5px solid var(--ink);aspect-ratio:16/8.4;overflow:hidden;background:#333}
.photo img{display:block;width:100%;height:100%;object-fit:cover;filter:sepia(.25) contrast(1.05)}
#rStamp{position:absolute;right:6px;bottom:6px;width:84px;height:84px;border:3px solid var(--red);border-radius:50%;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:11px;line-height:1.1;transform:rotate(-12deg);background:rgba(242,236,223,.86);white-space:nowrap}
#rStamp em{display:block;font-style:normal;font-size:22px;font-family:var(--min);font-weight:800;margin-top:2px;letter-spacing:-.02em}
#rBadges{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
#rBadges span{background:var(--gold);color:#231f2b;font-size:11px;font-weight:900;padding:2px 6px;transform:rotate(-2deg)}
.gauges{margin-top:7px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px;font-weight:700}
.gauges .bar{height:9px;background:var(--paper2);border:1px solid #6b6258;position:relative}
.gauges .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.gauges .rd{font-size:12px;color:var(--red);font-weight:900;min-width:5.5em;text-align:right}
#rHint{margin-top:6px;font-size:12px;font-weight:900;color:var(--ink);border-top:1px solid #8a8174;padding-top:5px}
.rbtns{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:7px;width:min(100%,400px);align-items:stretch}
.rrow{display:flex;gap:8px}
.rrow>button{flex:1;min-height:46px;border-radius:24px;font-weight:900;font-size:16px}
#btnAgain{background:var(--red);color:#fff;border:2px solid #23121a;box-shadow:0 4px 0 #7d1c19}
#bReplay{background:#f2ecdf;border:2px solid #23121a;display:flex;align-items:center;justify-content:center;gap:6px}
#bReplay svg{width:18px;height:18px}
#bReplay:disabled{opacity:.55}
.rrow.small>button{min-height:40px;font-size:14px;background:rgba(242,236,223,.9);border:1.5px solid #23121a}
.rfoot{display:flex;justify-content:center;gap:14px;font-size:11px}
@media (max-height:700px){.photo{aspect-ratio:16/6.2}.rbtns{padding-top:6px;gap:5px}}
.rfoot a,.rfoot button{color:rgba(255,255,255,.75);text-decoration:none;font-size:11px;min-height:24px}

/* ---------- 板（遊び方・最初の説明・マイク不可） ---------- */
.modal{z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,13,24,.66)}
.card{width:min(100%,360px);background:var(--paper);padding:18px 18px 16px;transform:rotate(-1deg);box-shadow:0 14px 30px -12px rgba(0,0,0,.7)}
.card h2{font-family:var(--min);font-weight:800;font-size:24px;margin-bottom:10px}
.card p,.card li{font-size:15px;line-height:1.6;font-weight:500}
.card ol{padding-left:1.3em;margin-bottom:8px}
.card .ladder{font-size:13px;font-weight:700;color:var(--red);margin:8px 0}
.card .cred{font-size:11px;color:var(--sub);margin-top:8px}
.card .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.card .btns button{min-height:48px;border-radius:24px;font-weight:900;font-size:16px;border:2px solid #23121a;background:#fbf8f0}
.card .btns button.pri{background:var(--red);color:#fff}
.tut3{display:flex;justify-content:space-between;gap:6px;margin:6px 0 4px}
.tut3 div{flex:1;text-align:center;font-family:var(--hand);font-size:24px;color:var(--red);background:#fbf8f0;border:1.5px solid #23121a;padding:8px 2px}
.tutEnd{text-align:center;font-weight:700;font-size:13px;margin-top:8px;white-space:pre-line}
.tutmic{display:block;margin:2px auto 8px;width:120px;height:70px}
#toast{position:fixed;left:50%;bottom:22svh;transform:translateX(-50%);z-index:60;background:rgba(20,18,28,.88);color:#fff;font-weight:700;padding:8px 14px;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<main id="vLoad" class="view">
  <svg viewBox="0 0 120 96" aria-hidden="true"><rect x="6" y="6" width="108" height="84" rx="8" fill="#1d1a24" stroke="#f2ecdf" stroke-width="3"/><path d="M22 66a40 40 0 0 1 76 0" fill="none" stroke="#f2ecdf" stroke-width="2"/><path d="M84 40a40 40 0 0 1 14 26" fill="none" stroke="#c4302b" stroke-width="5"/><line id="ldNeedle" x1="60" y1="70" x2="60" y2="30" stroke="#e7b43b" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="70" r="5" fill="#f2ecdf"/></svg>
  <p id="loadTxt">本日のリサイタル準備中</p>
  <div id="loadBar"><i></i></div>
</main>

<main id="vTitle" class="view" hidden>
  <div class="sign"><h1><span id="tT1">空き地リサイタル</span><small id="tT2">〜歌声を響かせろ！〜</small></h1></div>
  <p class="lead" id="tLead"></p>
  <div class="tbottom">
    <button id="bMic" class="big"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="20" cy="11" r="8" fill="#e3e6ea" stroke="#23121a" stroke-width="2"/><path d="M14.5 13.5 13 15" stroke="#23121a" stroke-width="2"/><path d="M15 16 5 28" stroke="#23121a" stroke-width="6" stroke-linecap="round"/><path d="M15 16 5 28" stroke="#3a3540" stroke-width="3" stroke-linecap="round"/><path d="M16 7.5l6 6M18 5.5l5.5 5.5" stroke="#9aa0a8" stroke-width="1.2"/></svg><span id="tMic">マイクで歌う</span></button>

  <div id="liveBox" hidden><canvas id="liveWave"></canvas><canvas id="liveScope"></canvas></div>

  <button id="bHeart" hidden></button>
</main>

  <div id="susSign"><span id="susTxt"></span></div>
  <p id="susSkip"></p>
</main>

<main id="vShow" class="view" hidden>
  <div id="telop"><b>速報</b><span id="telopTxt"></span></div>
  <p id="skipHint"></p>
</main>

<main id="vResult" class="view" hidden>
  <article class="paper" id="paper">
    <div class="mast"><span class="name" id="rName">空き地新聞</span><span class="ex" id="rEx">号外</span><span class="date" id="rDate"></span></div>

    <div class="rrow"><button id="bReplay"></button><button id="btnAgain"></button></div>
    <div class="rrow small"><button id="bSave"></button><button id="bPost"></button></div>
    <div class="rfoot" data-home-slot><button id="bHow2"></button></div>
  </div>
</main>

<main id="pTut" class="view modal" hidden>
  <div class="card">
    <h2 id="tutT"></h2>

<script>
// ブラウザの拡大を止める（ピンチ・ダブルタップ・トラックパッドのピンチ・Ctrl+ホイール/キー）。iOS は user-scalable=no を無視するので JS でも止める
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険。JS が動いたか（__jsUp）で判定する。読み込み中は失敗と出さない
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },6000);
})();
</script>
